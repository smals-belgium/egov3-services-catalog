asyncapi: 3.0.0
# !! AsyncAPI tooling can't be used for this document currently because of a problem with AsyncAPI tooling with referenced OpenAPI schemas, see https://github.com/asyncapi/openapi-schema-parser/issues/275
info:
  title: Stream API
  version: 2.0.0
  description: |
    The Stream API enables external partners to exchange files with Stream
    through SFTP and receive acknowledgements, validation results, and
    error notifications related to submitted files.
defaultContentType: application/json
servers:
  socialSecuritySftp:
    # sftp protocol, over which files are transferred containing a batch of Asynchronous Messages, using the AsynchronousMessagesBatch schema
    # also see https://www.belgif.be/specification/rest/api-guide/#rule-async-generic
    host: 'sftp.socialsecurity.be:8022'
    protocol: sftp
    description: |
      The Social Security SFTP server
      Also see ip and host specification https://www.socialsecurity.be/site_fr/general/helpcentre/batch/infos/whichip.htm
    bindings:
      {} # protocol-specific information, if needed
channels:
  InputDirectoryChannel:
    summary: Directory to send files with messages. Use IN for production and INTEST directory for test messages.
    address: "{inputDirectory}/{fileName}"
    parameters:
      inputDirectory:
        enum: ["IN", "INTEST"]
        default: "IN"
      fileName:
        description: |
          Name of the file uploaded to the input directory.
          The value must comply with the InputFileName naming convention  '^(FI|FS|GO)\\.EVENT\\.[0-9]{6}\\.[0-9a-fA-F-]{36}\\.(R|T)$'
    messages: {}
  OutputDirectoryChannel:
    summary: Output directory to receive messages. Use OUT for production and OUTTEST directory for test messages.
    address: "{outputDirectory}/{fileName}"
    parameters:
      outputDirectory:
        enum: ["OUT", "OUTTEST"]
        default: "OUT"
      fileName:
        description: |
          Name of the file available in the output directory.
          The value must comply with the OutputFileName naming convention  '^(FO|FS|GO)\\.EVENT\\.[0-9]{6}\\.[0-9a-fA-F-]{36}\\.(R|T)$'
    messages:
      "be.socialsecurity.services.stream.v1.delivery.rejected":
        $ref: '#/components/messages/be.socialsecurity.services.stream.v1.delivery.rejected'
      "be.socialsecurity.services.stream.v1.delivery.validated":
        $ref: '#/components/messages/be.socialsecurity.services.stream.v1.delivery.validated'
      "be.socialsecurity.services.stream.v1.asynchronousMessage.rejected":
        $ref: "#/components/messages/be.socialsecurity.services.stream.v1.asynchronousMessage.rejected"
operations:
  # the messages referenced by each operation MUST be part of the list of messages on the channel used by the operation
  # if omitted, the operation is expected to accept any message allowed on the channel
  receiveInputFileStatus:
    summary: "Receive status of input file (rejected or validated)"
    action: receive
    channel:
      $ref: '#/channels/OutputDirectoryChannel'
    messages:
      - $ref: '#/channels/OutputDirectoryChannel/messages/be.socialsecurity.services.stream.v1.delivery.rejected'
      - $ref: '#/channels/OutputDirectoryChannel/messages/be.socialsecurity.services.stream.v1.delivery.validated'
  notifyInputMessageInvalid:
    summary: "Receive notification that an input message does not have supported values for `service` or `type`"
    action: receive
    channel:
      $ref: '#/channels/OutputDirectoryChannel'
    messages:
      - $ref: '#/channels/OutputDirectoryChannel/messages/be.socialsecurity.services.stream.v1.asynchronousMessage.rejected'
components:
  messages:
    "be.socialsecurity.services.stream.v1.delivery.rejected":
      payload:
        schemaFormat: application/vnd.oai.openapi+yaml;version=3.0.0
        schema:
          $ref: 'stream-external-api-v2.yaml#/components/schemas/AckRejectedEvent'
    "be.socialsecurity.services.stream.v1.delivery.validated":
      payload:
        schemaFormat: application/vnd.oai.openapi+yaml;version=3.0.0
        schema:
          $ref: 'stream-external-api-v2.yaml#/components/schemas/AckValidatedEvent'
    "be.socialsecurity.services.stream.v1.asynchronousMessage.rejected":
      payload:
        schemaFormat: application/vnd.oai.openapi+yaml;version=3.0.0
        schema:
          $ref: 'stream-external-api-v2.yaml#/components/schemas/ProblemReplyEvent'