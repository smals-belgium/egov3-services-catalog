  parameters:
    CalculationIdPathParameter:
      name: calculationResultId
      in: path
      description: Universally Unique Identifier of a calculation result of salary data.
      required: true
      schema:
        $ref: "../../belgif/common/v1/common-v1.yaml#/components/schemas/Uuid"

  schemas:
    Enterprise:
      type: object
      description: Minimum one of the two data (nssoNumber (only definitive NSSO number) or enterpriseNumber) must be completed.
      properties:
        enterpriseNumber:
          $ref: "../../belgif/organization/identifier/v1/organization-identifier-v1.yaml#/components/schemas/EnterpriseNumber"
        nssoNumber:
          $ref: "../../belgif/employment/identifier/v1/employment-identifier-v1.yaml#/components/schemas/EmployerId"
      anyOf:
        - required: [ nssoNumber ]
        - required: [ enterpriseNumber ]

    NaturalPerson:
      type: object
      properties:
        ssin:
          $ref: "../../belgif/person/identifier/v1/person-identifier-v1.yaml#/components/schemas/Ssin"
      required:
        - ssin

    Relation:
      type: object
      properties:
        declarantReference:
          $ref: "#/components/schemas/DeclarantReference"
        type:
          $ref: "#/components/schemas/RelationType"
      required:
        - declarantReference
        - type

    Calculation:
      type: object
      x-parent: true
      properties:
        id:
          $ref: "../../belgif/common/v1/common-v1.yaml#/components/schemas/Uuid"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        calculationDate:
          type: string
          format: date
        frequency:
          $ref: "#/components/schemas/CalculationFrequency"
        relation:
          $ref: "#/components/schemas/Relation"
        enterprise:
          $ref: "#/components/schemas/Enterprise"
        naturalPerson:
          $ref: "#/components/schemas/NaturalPerson"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        identifyingSocialFeatures:
          type: array
          items:
            $ref: "#/components/schemas/IdentifyingSocialFeature"
        fiscalFeatures:
          type: array
          items:
            $ref: "#/components/schemas/FiscalFeature"
        # readOnly properties
        channel:
          type: string
          description: The channel through which the input was submitted.
          readOnly: true
          enum:
            - web
            - rest
            - batch
        receivedDate:
          type: string
          format: date-time
          description: The date and time at which the calculation was received.
          readOnly: true
        validation:
          $ref: "#/components/schemas/CalculationValidation"
      required:
        - id
        - startDate
        - endDate
        - calculationDate
        - frequency
        - relation
        - enterprise
        - naturalPerson

    CalculationValidation:
      type: object
      description: The processing status and issues of the input.
      readOnly: true
      properties:
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
        messageType:
          $ref: "#/components/schemas/MessageType"
        date:
          type: string
          description: The date and time at which the calculation was validated.
          format: date-time
        issues:
          type: array
          description: List of validation or processing issues detected in the input.
          items:
            $ref: '#/components/schemas/SalaryDataInputValidationIssue'
      required:
        - processingStatus
        - messageType

    ExternalReference:
      type: string
      maxLength: 64

    EmployerClass:
      type: string
      pattern: '^\d{1,5}$'

    WorkerCode:
      type: string
      pattern: '^\d{1,5}$'

    ProcessingStatus:
      type: string
      description: The current processing status of the salary data input.
      enum:
        - inProgress    # The input is currently being processed.
        - rejected      # The input was rejected due to a blocking error.
        - validated     # The processing of the input has been successfully completed and validated.
        - deleted       # The input has been deleted, no further action can be made.

    SalaryDataInputValidationProblem:
      type: object
      allOf:
        - $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SalaryDataInputValidationIssue"

    SalaryDataInputValidationIssue:
      allOf:
        - $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/InputValidationIssue"
        - type: object
          properties:
            externalReference:
              $ref: "#/components/schemas/ExternalReference"
            severity:
              type: string
              description: The impact level of the error on request processing
              enum:
                - blocking
                - notBlocking
                - informative
      required:
        - severity

    MessageType:
      type: string
      description: Type of message submitted for the calculation results of salary data.
        'creation' for a new submitted calculation results of salary data,
        'update' for a modification of a submitted calculation results,
        'cancel' for deletion of a submitted calculation results.
      enum:
        - creation
        - update
        - cancel

    DeclarantReference:
      type: string
      maxLength: 64
      description: relation declarant reference

    CalculationFrequency:
      type: integer
      enum:
        - 1 # Weekly
        - 2 # Bi-monthly
        - 3 # Monthly
        - 4 # Quarterly
        - 5 # Semi-annual
        - 6 # Annual
        - 99 # Other frequency

    RelationType:
      type: integer
      enum:
        - 1 # Employment contract
        - 2 # Statutory
        - 3 # Apprenticeship contract
        - 4 # Former worker
        - 999 # Other

    Service:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        type: # Service code
          type: string
          pattern: '^\d{7}$'
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        numberOfHours:
          type: integer
          minimum: 0
          maximum: 9999999
        serviceFeatures:
          $ref: "#/components/schemas/ServiceFeature"
        usingEmployer:
          $ref: "#/components/schemas/UsingEmployer"
      required:
        - type
        - startDate
        - numberOfHours

    ServiceFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        overtimeType:
          type: integer
          enum:
            - 1 # Recoverable overtime hours
            - 2 # Non-recoverable overtime hours
        subjectionToSocialSecurityContribution:
          type: integer
          enum:
            - 1 # Exempt from social security contributions
            - 2 # Subject to social security contributions
        overtimeIncludedInCalendar:
          type: integer
          enum:
            - 1 # Periodic-based benefits are not included in daily-based benefits
            - 2 # The periodic-based benefits in question are included in daily-based benefits
        seafarerServiceType:
          type: integer
          enum:
            - 1 # Navigation
            - 2 # Stand-by
            - 3 # Additional work
        legalVacationOrigin:
          type: integer
          enum:
            - 1 # granted on the basis of a holiday certificate
        nonAssimilationLegalVacationRights:
          type: integer
          enum:
            - 1 # not treated as equivalent to normal performance when determining the number of hours of statutory leave to which a person is entitled

    IdentifyingSocialFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        employmentStatus:
          $ref: "#/components/schemas/EmploymentStatus"
        employerClass:
          $ref: "#/components/schemas/EmployerClass"
        workerCode:
          $ref: "#/components/schemas/WorkerCode"
        flatRateCode:
          type: string
          pattern: '^\d{1,5}$'
        operationalSocialFeatures:
          type: array
          items:
            $ref: "#/components/schemas/OperationalSocialFeature"
        identifyingSocialFeaturesDetail:
          $ref: "#/components/schemas/IdentifyingSocialFeaturesDetail"
        financialElements:
          type: array
          items:
            $ref: "#/components/schemas/FinancialElement"
      required:
        - startDate
        - endDate
        - operationalSocialFeatures
        - employerClass
        - workerCode

    EmploymentStatus:
      type: string
      minLength: 5
      maxLength: 5

    OperationalSocialFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        contractType:
          type: integer
          enum:
            - 1 # Full time
            - 2 # Part time
        establishmentUnitNumber:
          $ref: "../../belgif/organization/identifier/v1/organization-identifier-v1.yaml#/components/schemas/EstablishmentUnitNumber"
        jointCommissionNumber:
          type: string
          pattern: '^\d{3}(\.\d{2}){0,2}$'
        economicActivity:
          $ref: "../../belgif/organization/v2/organization-v2.yaml#/components/schemas/NaceBel2025Length5Code"
        educationSectorPaymentMethod:
          type: integer
          enum:
            - 10 # payment in tenths
            - 12 # payment in twelfths
            - 20 # Reformed school year in French-speaking education
        operationalSocialFeaturesDetail:
          $ref: "#/components/schemas/OperationalSocialFeaturesDetail"
        weeklyHours:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyHour"
        financialElements:
          type: array
          items:
            $ref: "#/components/schemas/FinancialElement"
      required:
        - startDate
        - endDate
        - contractType
        - establishmentUnitNumber
        - jointCommissionNumber
        - weeklyHours

    WeeklyHour:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        type:
          type: string
          enum:
            - s # Data of the reference person of application for the worker in question
            - q # Data of the physical person without taking into account any possible suspension of work
            - m # Data of the physical person taking into account any full or partial suspension of work
        effectiveAverageWeeklyWorkingHours:
          type: integer
          minimum: 0
          maximum: 16800
        annualAverageWeeklyPaidWorkingHours:
          type: integer
          minimum: 0
          maximum: 16800
        reorganisationMeasures:
          type: array
          items:
            $ref: "#/components/schemas/ReorganisationMeasure"
      required:
        - effectiveAverageWeeklyWorkingHours
        - annualAverageWeeklyPaidWorkingHours

    ReorganisationMeasure:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        type:
          type: string
          pattern: '^\d{1,3}$'
        percentage:
          type: integer
          minimum: 1
          maximum: 10000
      required:
        - type
        - percentage

    AdditionalSocialFeaturesDetail:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
        - startDate
        - endDate

    OperationalSocialFeaturesDetail:
      type: object
      properties:
        gradualWorkResumption:
          $ref: "#/components/schemas/GradualWorkResumption"

    GradualWorkResumption:
      allOf:
        - $ref: "#/components/schemas/AdditionalSocialFeaturesDetail"
        - type: object
          properties:
            weeklyMaxNumberOfHoursAllowed:
              type: integer
              minimum: 1
              maximum: 99999
          required:
            - weeklyMaxNumberOfHoursAllowed

    IdentifyingSocialFeaturesDetail:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        dismissal:
          $ref: "#/components/schemas/Dismissal"
        starterJobs:
          type: array
          items:
            $ref: "#/components/schemas/StarterJob"
      required:
        - jobs
    Job:
      allOf:
        - $ref: "#/components/schemas/AdditionalSocialFeaturesDetail"
        - type: object
          properties:
            title:
              type: string
              maxLength: 100
            professionalClassificationSectoralCla: # Cla = collective labour agreement
              type: string
              maxLength: 100
            professionalClassificationEnterprise:
              type: string
              maxLength: 100

    Dismissal:
      allOf:
        - $ref: "#/components/schemas/AdditionalSocialFeaturesDetail"
        - type: object
          properties:
            noticePeriodStartDate:
              type: string
              format: date
            noticePeriodMonths:
              type: integer
              minimum: 1
              maximum: 99999
            noticePeriodWeeks:
              type: integer
              minimum: 1
              maximum: 99999
            noticePeriodDays:
              type: integer
              minimum: 1
              maximum: 99999
          required:
            - noticePeriodStartDate

    StarterJob:
      allOf:
        - $ref: "#/components/schemas/AdditionalSocialFeaturesDetail"
        - type: object
          properties:
            type:
              type: integer
              enum:
                - 1 # Worker under a first employment agreement type 1 (standard employment contract, nothing more)
                - 2 # Worker under a first employment agreement type 2 (combination with a part-time employment contract)
                - 3 # Worker under a first employment agreement type 3 (apprenticeship, internship, or integration agreement)
                - 4 # Worker with a disability under a first employment agreement type 1 (standard employment contract, nothing more)
                - 5 # Worker with a disability under a first employment agreement type 2 (combination with a part-time employment contract)
                - 6 # Worker with a disability under a first employment agreement type 3 (apprenticeship, internship, or integration agreement)
                - 7 # Worker of foreign origin under a first employment agreement type 1 (standard employment contract, nothing more)
                - 8 # Worker of foreign origin under a first employment agreement type 2 (combination with a part-time employment contract)
                - 9 # Worker of foreign origin under a first employment agreement type 3 (apprenticeship, internship, or integration agreement)
            remunerationPercentageForStarterTraining:
              type: integer
              minimum: 1
              maximum: 1000
          required:
            - type

    FinancialElement:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        code:
          type: string
          pattern: '^\d{1,7}$'
        amount:
          $ref: "../../belgif/money/v1/money-v1.yaml#/components/schemas/EuroCentAmount"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/FinancialElementRole"
          maxItems: 2
        bonusFeatures:
          $ref: "#/components/schemas/BonusFeature"
        voucherFeatures:
          type: array
          items:
            $ref: "#/components/schemas/VoucherFeature"
        severancePayFeatures:
          $ref: "#/components/schemas/SeverancePayFeature"
        holidayAfterSeveranceFeatures:
          type: array
          items:
            $ref: "#/components/schemas/HolidayAfterSeveranceFeature"
        paidRightBalanceFeatures:
          $ref: "#/components/schemas/PaidRightBalanceFeature"
        vacationPayFeatures:
          $ref: "#/components/schemas/VacationPayFeature"
      required:
        - code
        - amount
        - roles

    FinancialElementRole:
      type: integer
      enum:
        - 1 # Amount that effectively forms part of the gross amount subject to social security contributions
        - 2 # Amount that fictitiously forms part of the gross amount subject to social security contributions
        - 3 # Employee social security contribution
        - 4 # Reduction of an employee social security contribution
        - 5 # Positive movement on the gross taxable amount
        - 6 # Negative movement on the gross taxable amount
        - 7 # Tax withholding
        - 8 # Reduction of a tax withholding
        - 9 # Positive movement on the net amount
        - 10 # Negative movement on the net amount
        - 11 # Communication/Reference

    BonusFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        allocationFrequency:
          type: integer
          minimum: 0
          maximum: 99

    VoucherFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        numberOfUnits:
          type: integer
          format: int64
          minimum: 1
          maximum: 999999999999999
        amountPerUnit:
          $ref: "../../belgif/money/v1/money-v1.yaml#/components/schemas/EuroCentPositiveAmount"
      required:
        - numberOfUnits
        - amountPerUnit

    SeverancePayFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        numberOfDaysReductionByOutplacement:
          type: integer
          minimum: 1
          maximum: 28
      required:
        - startDate
        - endDate

    HolidayAfterSeveranceFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        date:
          type: string
          format: date
      required:
        - date

    FiscalFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        employmentStatus:
          $ref: "#/components/schemas/EmploymentStatus"
        civilStatusType:
          #$ref: "../../belgif/person/v2/person-v2.yaml#/components/schemas/CivilStatusTypeCode"
          type: integer
          enum:
            - 1 # Single
            - 2 # Married
            - 3 # Divorced
            - 4 # Legally separated
            - 5 # Widow or widower
            - 6 # Legal cohabitant
        numberOfDependentChildren:
          type: integer
          minimum: 0
          maximum: 99
        numberOfDependentDisabledChildren:
          type: integer
          minimum: 0
          maximum: 99
        numberOfDependents:
          type: integer
          minimum: 0
          maximum: 99
        numberOfDisabledDependents:
          type: integer
          minimum: 0
          maximum: 99
        disabilityIndicator:
          type: integer
          enum:
            - 1 # The person is not considered fiscally as a person with a disability
            - 2 # The person is considered fiscally as a person with a disability
        crossBorderWorker:
          type: integer
          enum:
            - 1 # Not a cross-border worker
            - 2 # Cross-border worker
        belgianResident:
          type: integer
          enum:
            - 1 # The individual is not considered a Belgian resident for tax purposes
            - 2 # The individual is considered a Belgian resident for tax purposes
        incomeOfPartner:
          type: integer
          enum:
            - 1 # The partner has no personal professional income
            - 2 # The partner has personal professional income not declared under another code.
            - 3 # The partner has personal professional income consisting exclusively of pensions, annuities, or similar income, with a net monthly amount not exceeding 170 €
            - 4 # The partner has personal professional income consisting exclusively of pensions, annuities, or similar income, with a net monthly amount not exceeding 563 €
            - 5 # The partner has personal professional income other than pensions, annuities, or similar income, with a net monthly amount not exceeding 283 €
        disabilityOfPartner:
          type: integer
          enum:
            - 1 # The partner is not considered fiscally as a person with a disability
            - 2 # The partner is considered fiscally as a person with a disability
        numberOfDependentsNeedingCare:
          type: integer
          minimum: 0
          maximum: 99
        retired:
          type: integer
          enum:
            - 1 # Retired
            - 2 # Not retired or this information is unknown to the sender
        financialElements:
          type: array
          items:
            $ref: "#/components/schemas/FinancialElement"
      required:
        - startDate
        - endDate
        - civilStatusType
        - numberOfDependentChildren
        - numberOfDependentDisabledChildren
        - numberOfDependents
        - numberOfDisabledDependents
        - disabilityIndicator
        - crossBorderWorker
        - belgianResident
        - numberOfDependentsNeedingCare
        - retired

    PaidRightBalanceFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        numberOfPaidHours:
          type: integer
          minimum: 1
          maximum: 99999
        serviceType:
          type: string
          pattern: '^\d{1,7}$'
      required:
        - numberOfPaidHours
        - serviceType

    VacationPayFeature:
      type: object
      properties:
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
        vacationHoursBalance:
          type: integer
          minimum: 0
          maximum: 67200
        initialVacationHours:
          type: integer
          minimum: 0
          maximum: 67200
      required:
        - vacationHoursBalance

    UsingEmployer:
      type: object
      properties:
        enterpriseNumber:
          $ref: "../../belgif/organization/identifier/v1/organization-identifier-v1.yaml#/components/schemas/EnterpriseNumber"
        externalReference:
          $ref: "#/components/schemas/ExternalReference"
      required:
        - enterpriseNumber

    PageLinks:
      description: Object containing links of paginated collection of resources
      type: object
      properties:
        prev:
          type: string
          description: URL of the previous page
          format: uri
        next:
          type: string
          description: URL of the next page
          format: uri
        page:
          type: integer
          description: Number of the current page
        pageSize:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of items found

    CalculationResultSearchRequest:
      type: object
      x-parent: true
      description: Request object containing criteria for searching calculation result summaries of salary data.
      properties:
        ids:
          description: A list of id's you want to search for. If provided, 'from' and 'to' dates are not required.
          type: array
          maxItems: 50
          items:
            $ref: "../../belgif/common/v1/common-v1.yaml#/components/schemas/Uuid"
        enterpriseNumbers:
          description: A list of enterpriseNumber's you want to search for.
          type: array
          maxItems: 10
          items:
            $ref: "../../belgif/organization/identifier/v1/organization-identifier-v1.yaml#/components/schemas/EnterpriseNumber"
        nssoNumbers:
          description: A list of nssoNumber's you want to search for.
          type: array
          maxItems: 10
          items:
            $ref: "../../belgif/employment/identifier/v1/employment-identifier-v1.yaml#/components/schemas/EmployerId"
        ssins:
          description: A list of ssin's you want to search for.
          type: array
          maxItems: 50
          items:
            $ref: "../../belgif/person/identifier/v1/person-identifier-v1.yaml#/components/schemas/Ssin"
        declarantReferences:
          description: A list of Declarant references you want to search for.
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DeclarantReference"
        relationTypes:
          description: A list of relation types you want to search for.
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/RelationType"
        from:
          type: string
          format: date
          description: The start date (inclusive) of the search window. Required if searching without 'ids'. A CalculationResult is returned if any part of its duration overlaps with this search period.
        to:
          type: string
          format: date
          description: The end date (inclusive) of the search window. Required if searching without 'ids'. The total range between 'from' and 'to' cannot exceed 3 calendar months.
        processingStatuses:
          description: A list of the current processing status of the salary data input.
          type: array
          items:
            $ref: "#/components/schemas/ProcessingStatus"
          example: [ "validated","inProgress" ]
        lastValidatedOnly:
          description: If true, the search returns only the last validated situation of a calculation result for each calculation result found.
          type: boolean
          default: false

    CalculationResultsCollection:
      type: object
      description: List of calculation results summaries
      allOf:
        - $ref: '#/components/schemas/PageLinks'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CalculationResultSummary'
      required:
        - total
        - items

    CalculationResultSummary:
      type: object
      x-parent: true
      properties:
        href:
          type: string
          format: uri
          description: URL to retrieve the full calculation resource (Return last situation of calculation results of salary data for a given id.)
        id:
          $ref: "../../belgif/common/v1/common-v1.yaml#/components/schemas/Uuid"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        calculationDate:
          type: string
          format: date
        frequency:
          $ref: "#/components/schemas/CalculationFrequency"
        relation:
          $ref: '#/components/schemas/Relation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'
        naturalPerson:
          $ref: '#/components/schemas/NaturalPerson'
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
        messageType:
          $ref: "#/components/schemas/MessageType"
      required:
        - href
        - id
        - processingStatus
        - messageType

    CancelCalculation:
      type: object
      x-parent: true
      properties:
        id:
          $ref: "../../belgif/common/v1/common-v1.yaml#/components/schemas/Uuid"
        enterprise:
          $ref: "#/components/schemas/Enterprise"
        naturalPerson:
          $ref: "#/components/schemas/NaturalPerson"
        declarantReference:
          $ref: "#/components/schemas/DeclarantReference"
        # readOnly properties
        channel:
          type: string
          description: The channel through which the input was submitted.
          readOnly: true
          enum:
            - web
            - rest
            - batch
        receivedDate:
          type: string
          format: date-time
          description: The date and time at which the calculation was received.
          readOnly: true
        validation:
          $ref: "#/components/schemas/CalculationValidation"
      required:
        - id
        - enterprise
        - naturalPerson
        - declarantReference
