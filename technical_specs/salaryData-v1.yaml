openapi: 3.0.3
info:
  title: Salary Data - REST API
  description: Service that allows to transmit salary data
  contact:
    name: LTDS team
    email: LTDS@smals.be
  version: 1.0.3
servers:
- url: https://services.socialsecurity.be/REST/salaryData/v1
tags:
- name: Calculation Results
  description: Information about calculation results of salary data
- name: Monitoring
  description: Service monitoring
paths:
  /calculationResults:
    post:
      tags:
      - Calculation Results
      summary: Submit calculation results of salary data for a relationship between
        an enterprise and a natural person.
      operationId: submitCalculationResults
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Calculation"
            examples:
              fullCalculationExample:
                $ref: "#/components/examples/FullCalculationRequest"
              minimalCalculationExample:
                $ref: "#/components/examples/MinimalCalculationRequest"
        required: true
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Location of calculation results sent
              style: simple
              explode: false
              schema:
                type: string
                format: uri
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "403":
          description: Forbidden – the client does not have permission to access this
            resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - Oauth:
        - scope:rsz-onss:management:ltds:input-rest:ltds
        - scope:rsz-onss:management:ltds:input-rest:employer
        - scope:rsz-onss:management:ltds:input-rest:representative
        - scope:rsz-onss:management:ltds:input-rest:provider
        - scope:rsz-onss:management:ltds:input-rest:professional
      x-oauth2-required-scopes: any
      x-content-type: application/json
      x-accepts: []
      x-tags:
      - tag: Calculation Results
  /calculationResults/search:
    post:
      tags:
      - Calculation Results
      summary: Retrieve a list of last situation of calculation results summaries
      operationId: searchCalculationResultSummaries
      parameters:
      - name: page
        in: query
        description: Page number for pagination
        required: false
        style: form
        explode: true
        schema:
          minimum: 1
          type: integer
          default: 1
      - name: pageSize
        in: query
        description: Number of items per page
        required: false
        style: form
        explode: true
        schema:
          maximum: 100
          minimum: 1
          type: integer
          default: 10
      - name: sort
        in: query
        description: "Field name for sorting, prefix with '-' for descending (e.g.,\
          \ -startDate). Direction is ascending by default. Possible options are:\
          \ startDate, endDate, enterpriseNumber, ssin, frequency, messageType, status"
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationResultSearchRequest"
            examples:
              searchByEnterpriseAndDateRange:
                $ref: "#/components/examples/SearchByEnterpriseAndDateRangeRequest"
              searchBySsinAndStatus:
                $ref: "#/components/examples/SearchBySsinAndStatusRequest"
              searchByMultipleIds:
                $ref: "#/components/examples/SearchByMultipleIdsRequest"
        required: true
      responses:
        "200":
          description: The requested resource was found or a search request returns
            some content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResultsCollection"
              examples:
                searchResultsMultipleItems:
                  $ref: "#/components/examples/SearchResultsMultipleItemsResponse"
                searchResultsSingleItem:
                  $ref: "#/components/examples/SearchResultsSingleItemResponse"
                searchResultsEmpty:
                  $ref: "#/components/examples/SearchResultsEmptyResponse"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/InputValidationProblem"
        "403":
          description: Forbidden – the client does not have permission to access this
            resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - Oauth:
        - scope:rsz-onss:management:ltds:input-rest:ltds
        - scope:rsz-onss:management:ltds:input-rest:employer
        - scope:rsz-onss:management:ltds:input-rest:representative
        - scope:rsz-onss:management:ltds:input-rest:provider
        - scope:rsz-onss:management:ltds:input-rest:professional
        - scope:rsz-onss:management:ltds:input-rest:support
      x-oauth2-required-scopes: any
      x-content-type: application/json
      x-accepts:
      - application/json
      x-tags:
      - tag: Calculation Results
  /calculationResults/{calculationResultId}:
    get:
      tags:
      - Calculation Results
      summary: Return last situation of calculation results of salary data for a given
        id.
      operationId: getCalculationResultsById
      parameters:
      - name: calculationResultId
        in: path
        description: Universally Unique Identifier of a calculation result of salary
          data.
        required: true
        style: simple
        explode: false
        schema:
          $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: The requested resource was found or a search request returns
            some content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
              examples:
                inProgressCalculationResult:
                  $ref: "#/components/examples/InProgressCalculationResponse"
                validatedCalculationResult:
                  $ref: "#/components/examples/ValidatedCalculationResponse"
                rejectedCalculationResult:
                  $ref: "#/components/examples/RejectedCalculationResponse"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "403":
          description: Forbidden – the client does not have permission to access this
            resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "404":
          description: The requested resource was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - Oauth:
        - scope:rsz-onss:management:ltds:input-rest:ltds
        - scope:rsz-onss:management:ltds:input-rest:employer
        - scope:rsz-onss:management:ltds:input-rest:representative
        - scope:rsz-onss:management:ltds:input-rest:provider
        - scope:rsz-onss:management:ltds:input-rest:professional
        - scope:rsz-onss:management:ltds:input-rest:support
      x-oauth2-required-scopes: any
      x-accepts:
      - application/json
      x-tags:
      - tag: Calculation Results
    put:
      tags:
      - Calculation Results
      summary: Update calculation results of salary data by id.
      operationId: updateCalculationResultsById
      parameters:
      - name: calculationResultId
        in: path
        description: Universally Unique Identifier of a calculation result of salary
          data.
        required: true
        style: simple
        explode: false
        schema:
          $ref: "#/components/schemas/Uuid"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Calculation"
            examples:
              fullCalculationExample:
                $ref: "#/components/examples/FullCalculationRequest"
        required: true
      responses:
        "204":
          description: No content
          headers:
            Location:
              description: Location of modified relation
              style: simple
              explode: false
              schema:
                type: string
                format: uri
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "403":
          description: Forbidden – the client does not have permission to access this
            resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "404":
          description: The requested resource was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - Oauth:
        - scope:rsz-onss:management:ltds:input-rest:ltds
        - scope:rsz-onss:management:ltds:input-rest:employer
        - scope:rsz-onss:management:ltds:input-rest:representative
        - scope:rsz-onss:management:ltds:input-rest:provider
        - scope:rsz-onss:management:ltds:input-rest:professional
      x-oauth2-required-scopes: any
      x-content-type: application/json
      x-accepts: []
      x-tags:
      - tag: Calculation Results
    delete:
      tags:
      - Calculation Results
      summary: Delete calculation results of salary data by id.
      operationId: cancelCalculationResultsById
      parameters:
      - name: calculationResultId
        in: path
        description: Universally Unique Identifier of a calculation result of salary
          data.
        required: true
        style: simple
        explode: false
        schema:
          $ref: "#/components/schemas/Uuid"
      - name: enterpriseNumber
        in: query
        description: Filter by enterprise number
        required: false
        style: form
        explode: true
        schema:
          $ref: "#/components/schemas/EnterpriseNumber"
      - name: nssoNumber
        in: query
        description: Filter by NSSO number
        required: false
        style: form
        explode: true
        schema:
          $ref: "#/components/schemas/EmployerId"
      - name: ssin
        in: query
        description: Filter by Social Security Identification Number issued by the
          National Register or CBSS
        required: true
        style: form
        explode: true
        schema:
          $ref: "#/components/schemas/Ssin"
      - name: declarantReference
        in: query
        description: Filter by relation declarant reference
        required: true
        style: form
        explode: true
        schema:
          $ref: "#/components/schemas/DeclarantReference"
      responses:
        "204":
          description: No content
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "403":
          description: Forbidden – the client does not have permission to access this
            resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "404":
          description: The requested resource was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "409":
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - Oauth:
        - scope:rsz-onss:management:ltds:input-rest:ltds
        - scope:rsz-onss:management:ltds:input-rest:employer
        - scope:rsz-onss:management:ltds:input-rest:representative
        - scope:rsz-onss:management:ltds:input-rest:provider
        - scope:rsz-onss:management:ltds:input-rest:professional
      x-oauth2-required-scopes: any
      x-accepts: []
      x-tags:
      - tag: Calculation Results
  /calculationResults/{calculationResultId}/lastValidated:
    get:
      tags:
      - Calculation Results
      summary: Return the last validated situation of calculation results for a given
        calculation ID.
      operationId: getLastValidatedCalculationResultById
      parameters:
      - name: calculationResultId
        in: path
        description: Universally Unique Identifier of a calculation result of salary
          data.
        required: true
        style: simple
        explode: false
        schema:
          $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: The requested resource was found or a search request returns
            some content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
              examples:
                validatedCalculationResult:
                  $ref: "#/components/examples/ValidatedCalculationResponse"
                rejectedCalculationResult:
                  $ref: "#/components/examples/RejectedCalculationResponse"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "403":
          description: Forbidden – the client does not have permission to access this
            resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "404":
          description: The requested resource was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security:
      - Oauth:
        - scope:rsz-onss:management:ltds:input-rest:ltds
        - scope:rsz-onss:management:ltds:input-rest:employer
        - scope:rsz-onss:management:ltds:input-rest:representative
        - scope:rsz-onss:management:ltds:input-rest:provider
        - scope:rsz-onss:management:ltds:input-rest:professional
        - scope:rsz-onss:management:ltds:input-rest:support
      x-oauth2-required-scopes: any
      x-accepts:
      - application/json
      x-tags:
      - tag: Calculation Results
  /health:
    get:
      tags:
      - Monitoring
      summary: Check health of the service.
      externalDocs:
        url: https://www.belgif.be/specification/rest/api-guide/#health
      operationId: checkHealth
      responses:
        "200":
          description: The service is UP or DEGRADED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                responseUp:
                  value:
                    status: UP
                responseDegraded:
                  value:
                    status: DEGRADED
        "503":
          description: The service is DOWN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              examples:
                responseDown:
                  value:
                    status: DOWN
        "500":
          description: a problem
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
      x-accepts:
      - application/json
      x-tags:
      - tag: Monitoring
components:
  schemas:
    Enterprise:
      type: object
      properties:
        enterpriseNumber:
          pattern: "^[0-1]\\d{9}$"
          type: string
          description: Identifier issued by CBE for a registered organization
        nssoNumber:
          maximum: 5999999999
          minimum: 197
          type: integer
          description: "Definitive or provisional NSSO number, assigned to each registered\
            \ employer or local or provincial administration."
          format: int64
      description: Minimum one of the two data (nssoNumber (only definitive NSSO number)
        or enterpriseNumber) must be completed.
      anyOf:
      - required:
        - nssoNumber
      - required:
        - enterpriseNumber
    NaturalPerson:
      required:
      - ssin
      type: object
      properties:
        ssin:
          pattern: "^\\d{11}$"
          type: string
          description: Social Security Identification Number issued by the National
            Register or CBSS
    Relation:
      required:
      - declarantReference
      - type
      type: object
      properties:
        declarantReference:
          maxLength: 64
          type: string
          description: relation declarant reference
        type:
          $ref: "#/components/schemas/RelationType"
    Calculation:
      required:
      - calculationDate
      - endDate
      - enterprise
      - frequency
      - id
      - naturalPerson
      - relation
      - startDate
      type: object
      properties:
        id:
          pattern: "^[\\da-f]{8}-[\\da-f]{4}-[\\da-f]{4}-[\\da-f]{4}-[\\da-f]{12}$"
          type: string
          description: "Universally Unique Identifier, as standardized in RFC 4122\
            \ and ISO/IEC 9834-8"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        calculationDate:
          type: string
          format: date
        frequency:
          $ref: "#/components/schemas/CalculationFrequency"
        relation:
          $ref: "#/components/schemas/Relation"
        enterprise:
          $ref: "#/components/schemas/Enterprise"
        naturalPerson:
          $ref: "#/components/schemas/NaturalPerson"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        identifyingSocialFeatures:
          type: array
          items:
            $ref: "#/components/schemas/IdentifyingSocialFeature"
        fiscalFeatures:
          type: array
          items:
            $ref: "#/components/schemas/FiscalFeature"
        channel:
          type: string
          description: The channel through which the input was submitted.
          readOnly: true
          enum:
          - web
          - rest
          - batch
        receivedDate:
          type: string
          description: The date and time at which the calculation was received.
          format: date-time
          readOnly: true
        validation:
          $ref: "#/components/schemas/CalculationValidation"
      x-parent: true
    CalculationValidation:
      required:
      - messageType
      - processingStatus
      type: object
      properties:
        processingStatus:
          $ref: "#/components/schemas/ProcessingStatus"
        messageType:
          $ref: "#/components/schemas/MessageType"
        date:
          type: string
          description: The date and time at which the calculation was validated.
          format: date-time
        issues:
          type: array
          description: List of validation or processing issues detected in the input.
          items:
            $ref: "#/components/schemas/SalaryDataInputValidationIssue"
      description: The processing status and issues of the input.
      readOnly: true
    ExternalReference:
      maxLength: 64
      type: string
    EmployerClass:
      pattern: "^\\d{1,5}$"
      type: string
    WorkerCode:
      pattern: "^\\d{1,5}$"
      type: string
    ProcessingStatus:
      type: string
      description: The current processing status of the salary data input.
      enum:
      - inProgress
      - rejected
      - validated
      - deleted
    SalaryDataInputValidationProblem:
      type: object
      properties:
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SalaryDataInputValidationIssue"
      allOf:
      - $ref: "#/components/schemas/Problem"
    SalaryDataInputValidationIssue:
      required:
      - severity
      allOf:
      - $ref: "#/components/schemas/InputValidationIssue"
      - type: object
        properties:
          externalReference:
            $ref: "#/components/schemas/ExternalReference"
          severity:
            type: string
            description: The impact level of the error on request processing
            enum:
            - blocking
            - notBlocking
            - informative
    MessageType:
      type: string
      description: "Type of message submitted for the calculation results of salary\
        \ data. 'creation' for a new submitted calculation results of salary data,\
        \ 'update' for a modification of a submitted calculation results, 'cancel'\
        \ for deletion of a submitted calculation results."
      enum:
      - creation
      - update
      - cancel
    DeclarantReference:
      maxLength: 64
      type: string
      description: relation declarant reference
    CalculationFrequency:
      type: integer
      enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 99
    RelationType:
      type: integer
      enum:
      - 1
      - 2
      - 3
      - 4
      - 999
    Service:
      required:
      - numberOfHours
      - startDate
      - type
      type: object
      properties:
        externalReference:
          maxLength: 64
          type: string
        type:
          pattern: "^\\d{7}$"
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        numberOfHours:
          maximum: 9999999
          minimum: 0
          type: integer
        serviceFeatures:
          $ref: "#/components/schemas/ServiceFeature"
        usingEmployer:
          $ref: "#/components/schemas/UsingEmployer"
    ServiceFeature:
      type: object
      properties:
        externalReference:
          maxLength: 64
          type: string
        overtimeType:
          type: integer
          enum:
          - 1
          - 2
        subjectionToSocialSecurityContribution:
          type: integer
          enum:
          - 1
          - 2
        overtimeIncludedInCalendar:
          type: integer
          enum:
          - 1
          - 2
        seafarerServiceType:
          type: integer
          enum:
          - 1
          - 2
          - 3
        legalVacationOrigin:
          type: integer
          enum:
          - 1
        nonAssimilationLegalVacationRights:
          type: integer
          enum:
          - 1
    IdentifyingSocialFeature:
      required:
      - employerClass
      - endDate
      - operationalSocialFeatures
      - startDate
      - workerCode
      type: object
      properties:
        externalReference:
          maxLength: 64
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        employmentStatus:
          maxLength: 5
          minLength: 5
          type: string
        employerClass:
          pattern: "^\\d{1,5}$"
          type: string
        workerCode:
          pattern: "^\\d{1,5}$"
          type: string
        flatRateCode:
          pattern: "^\\d{1,5}$"
          type: string
        operationalSocialFeatures:
          type: array
          items:
            $ref: "#/components/schemas/OperationalSocialFeature"
        identifyingSocialFeaturesDetail:
          $ref: "#/components/schemas/IdentifyingSocialFeaturesDetail"
        financialElements:
          type: array
          items:
            $ref: "#/components/schemas/FinancialElement"
    EmploymentStatus:
      maxLength: 5
      minLength: 5
      type: string
    OperationalSocialFeature:
      required:
      - contractType
      - endDate
      - establishmentUnitNumber
      - jointCommissionNumber
      - startDate
      - weeklyHours
      type: object
      properties:
        externalReference:
          maxLength: 64
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        contractType:
          type: integer
          enum:
          - 1
          - 2
        establishmentUnitNumber:
          pattern: "^[2-8]\\d{9}$"
          type: string
          description: Identifier issued by CBE for a site (establishment) of an organization
        jointCommissionNumber:
          pattern: "^\\d{3}(\\.\\d{2}){0,2}$"
          type: string
        economicActivity:
          pattern: "^\\d{5}$"
          type: string
          description: |
            Belgian NACE activity code of 5 digits, as used for NSSO and for VAT purposes (version 2025).

            The meaning of the first four digits are standard across all countries, defined by NACE Revision 2_1.
            The last digit is defined in the Belgian NACE 2025 list.
        educationSectorPaymentMethod:
          type: integer
          enum:
          - 10
          - 12
          - 20
        operationalSocialFeaturesDetail:
          $ref: "#/components/schemas/OperationalSocialFeaturesDetail"
        weeklyHours:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyHour"
        financialElements:
          type: array
          items:
            $ref: "#/components/schemas/FinancialElement"
    WeeklyHour:
      required:
      - annualAverageWeeklyPaidWorkingHours
      - effectiveAverageWeeklyWorkingHours
      type: object
