openapi: 3.0.3
info:
  title: "Salary Data - REST API"
  description: "Service that allows to transmit salary data"
  version: 1.0.3
  contact:
    name: LTDS team
    email: LTDS@smals.be
servers:
  - url: https://services.socialsecurity.be/REST/salaryData/v1
#security: A compléter
tags:
  - name: Calculation Results
    description: "Information about calculation results of salary data"
  - name: Monitoring
    description: "Service monitoring"

paths:
  /calculationResults:
    post:
      tags:
        - Calculation Results
      summary: Submit calculation results of salary data for a relationship between an enterprise and a natural person.
      operationId: submitCalculationResults
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Calculation"
            examples:
              fullCalculationExample:
                $ref: "#/components/examples/FullCalculationRequest"
              minimalCalculationExample:
                $ref: "#/components/examples/MinimalCalculationRequest"
        required: true
      responses:
        201:
          description: Created
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Location of calculation results sent
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        403:
          description: Forbidden – the client does not have permission to access this resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        409:
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        500:
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
      security:
        - Oauth:
            - scope:rsz-onss:management:ltds:input-rest:ltds
            - scope:rsz-onss:management:ltds:input-rest:employer
            - scope:rsz-onss:management:ltds:input-rest:representative
            - scope:rsz-onss:management:ltds:input-rest:provider
            - scope:rsz-onss:management:ltds:input-rest:professional
      x-oauth2-required-scopes: any

  /calculationResults/search:
    post:
      tags:
        - Calculation Results
      summary: Retrieve a list of last situation of calculation results summaries
      operationId: searchCalculationResultSummaries
      parameters:
        # Pagination
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number for pagination
          required: false
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of items per page
          required: false
        # Sorting
        - name: sort
          in: query
          required: false
          description: "Field name for sorting, prefix with '-' for descending (e.g., -startDate). Direction is ascending by default. Possible options are: startDate, endDate, enterpriseNumber, ssin, frequency, messageType, status"
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationResultSearchRequest"
            examples:
              searchByEnterpriseAndDateRange:
                $ref: "#/components/examples/SearchByEnterpriseAndDateRangeRequest"
              searchBySsinAndStatus:
                $ref: "#/components/examples/SearchBySsinAndStatusRequest"
              searchByMultipleIds:
                $ref: "#/components/examples/SearchByMultipleIdsRequest"
        required: true
      responses:
        200:
          description: The requested resource was found or a search request returns some content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResultsCollection"
              examples:
                searchResultsMultipleItems:
                  $ref: "#/components/examples/SearchResultsMultipleItemsResponse"
                searchResultsSingleItem:
                  $ref: "#/components/examples/SearchResultsSingleItemResponse"
                searchResultsEmpty:
                  $ref: "#/components/examples/SearchResultsEmptyResponse"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/InputValidationProblem"
        403:
          description: Forbidden – the client does not have permission to access this resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        500:
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
      security:
        - Oauth:
            - scope:rsz-onss:management:ltds:input-rest:ltds
            - scope:rsz-onss:management:ltds:input-rest:employer
            - scope:rsz-onss:management:ltds:input-rest:representative
            - scope:rsz-onss:management:ltds:input-rest:provider
            - scope:rsz-onss:management:ltds:input-rest:professional
            - scope:rsz-onss:management:ltds:input-rest:support
      x-oauth2-required-scopes: any

  /calculationResults/{calculationResultId}:
    get:
      tags:
        - Calculation Results
      summary: Return last situation of calculation results of salary data for a given id.
      operationId: getCalculationResultsById
      parameters:
        - $ref: "#/components/parameters/CalculationIdPathParameter"
      responses:
        200:
          description: The requested resource was found or a search request returns some content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
              examples:
                inProgressCalculationResult:
                  $ref: "#/components/examples/InProgressCalculationResponse"
                validatedCalculationResult:
                  $ref: "#/components/examples/ValidatedCalculationResponse"
                rejectedCalculationResult:
                  $ref: "#/components/examples/RejectedCalculationResponse"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        403:
          description: Forbidden – the client does not have permission to access this resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        404:
          description: The requested resource was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        500:
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
      security:
        - Oauth:
            - scope:rsz-onss:management:ltds:input-rest:ltds
            - scope:rsz-onss:management:ltds:input-rest:employer
            - scope:rsz-onss:management:ltds:input-rest:representative
            - scope:rsz-onss:management:ltds:input-rest:provider
            - scope:rsz-onss:management:ltds:input-rest:professional
            - scope:rsz-onss:management:ltds:input-rest:support
      x-oauth2-required-scopes: any

    put:
      tags:
        - Calculation Results
      summary: Update calculation results of salary data by id.
      operationId: updateCalculationResultsById
      parameters:
        - $ref: "#/components/parameters/CalculationIdPathParameter"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Calculation"
            examples:
              fullCalculationExample:
                $ref: "#/components/examples/FullCalculationRequest"
        required: true
      responses:
        204:
          description: No content
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: Location of modified relation
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        403:
          description: Forbidden – the client does not have permission to access this resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        404:
          description: The requested resource was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        409:
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        500:
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
      security:
        - Oauth:
            - scope:rsz-onss:management:ltds:input-rest:ltds
            - scope:rsz-onss:management:ltds:input-rest:employer
            - scope:rsz-onss:management:ltds:input-rest:representative
            - scope:rsz-onss:management:ltds:input-rest:provider
            - scope:rsz-onss:management:ltds:input-rest:professional
      x-oauth2-required-scopes: any

    delete:
      tags:
        - Calculation Results
      summary: Delete calculation results of salary data by id.
      operationId: cancelCalculationResultsById
      parameters:
        - $ref: "#/components/parameters/CalculationIdPathParameter"
        - name: enterpriseNumber
          in: query
          description: Filter by enterprise number
          required: false
          schema:
            $ref: "../../belgif/organization/identifier/v1/organization-identifier-v1.yaml#/components/schemas/EnterpriseNumber"
        - name: nssoNumber
          in: query
          description: Filter by NSSO number
          required: false
          schema:
            $ref: "../../belgif/employment/identifier/v1/employment-identifier-v1.yaml#/components/schemas/EmployerId"
        - name: ssin
          in: query
          description: Filter by Social Security Identification Number issued by the National Register or CBSS
          required: true
          schema:
            $ref: "../../belgif/person/identifier/v1/person-identifier-v1.yaml#/components/schemas/Ssin"
        - name: declarantReference
          in: query
          description: Filter by relation declarant reference
          required: true
          schema:
            $ref: "#/components/schemas/DeclarantReference"
      responses:
        204:
          description: No content
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        403:
          description: Forbidden – the client does not have permission to access this resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        404:
          description: The requested resource was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        409:
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        500:
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
      security:
        - Oauth:
            - scope:rsz-onss:management:ltds:input-rest:ltds
            - scope:rsz-onss:management:ltds:input-rest:employer
            - scope:rsz-onss:management:ltds:input-rest:representative
            - scope:rsz-onss:management:ltds:input-rest:provider
            - scope:rsz-onss:management:ltds:input-rest:professional
      x-oauth2-required-scopes: any

  /calculationResults/{calculationResultId}/lastValidated:
    get:
      tags:
        - Calculation Results
      summary: Return the last validated situation of calculation results for a given calculation ID.
      operationId: getLastValidatedCalculationResultById
      parameters:
        - $ref: "#/components/parameters/CalculationIdPathParameter"
      responses:
        200:
          description: The requested resource was found or a search request returns some content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calculation"
              examples:
                validatedCalculationResult:
                  $ref: "#/components/examples/ValidatedCalculationResponse"
                rejectedCalculationResult:
                  $ref: "#/components/examples/RejectedCalculationResponse"
        400:
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        403:
          description: Forbidden – the client does not have permission to access this resource
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        404:
          description: The requested resource was not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/SalaryDataInputValidationProblem"
        500:
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
      security:
        - Oauth:
            - scope:rsz-onss:management:ltds:input-rest:ltds
            - scope:rsz-onss:management:ltds:input-rest:employer
            - scope:rsz-onss:management:ltds:input-rest:representative
            - scope:rsz-onss:management:ltds:input-rest:provider
            - scope:rsz-onss:management:ltds:input-rest:professional
            - scope:rsz-onss:management:ltds:input-rest:support
      x-oauth2-required-scopes: any

  /health:
    get:
      tags:
        - Monitoring
      summary: Check health of the service.
      operationId: checkHealth
      externalDocs:
        url: "https://www.belgif.be/specification/rest/api-guide/#health"
      responses:
        200:
          description: The service is UP or DEGRADED
          content:
            application/json:
              schema:
                $ref: "../../belgif/common/v1/common-v1.yaml#/components/schemas/HealthStatus"
              examples:
                responseUp:
                  value:
                    {
                      "status": "UP"
                    }
                responseDegraded:
                  value:
                    {
                      "status": "DEGRADED"
                    }
        503:
          description: The service is DOWN.
          content:
            application/json:
              schema:
                $ref: "../../belgif/common/v1/common-v1.yaml#/components/schemas/HealthStatus"
              examples:
                responseDown:
                  value:
                    {
                      "status": "DOWN"
                    }
        500:
          $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/responses/ProblemResponse"
        default:
          description: Default response
          content:
            application/problem+json:
              schema:
                $ref: "../../belgif/problem/v1/problem-v1.yaml#/components/schemas/Problem"
      security: [ ]

components:
  securitySchemes:
    Oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: 'https://oauth-v5.socialsecurity.be/oauth2/authorize'
          tokenUrl: 'https://services.socialsecurity.be/REST/oauth/v5/token'
          scopes:
            scope:rsz-onss:management:ltds:input-rest:employer: LTDS - Scope to be used by employers.
            scope:rsz-onss:management:ltds:input-rest:representative: LTDS - Scope to be used by representatives.
            scope:rsz-onss:management:ltds:input-rest:provider: LTDS - Scope to be used by service provider.
            scope:rsz-onss:management:ltds:input-rest:professional: LTDS - Scope to be used by professionals.
            scope:rsz-onss:management:ltds:input-rest:support: LTDS - Scope to be used by GATB.
            scope:rsz-onss:management:ltds:input-rest:monitoring: LTDS - Scope to be used by monitoring.
        clientCredentials:
          tokenUrl: 'https://services.socialsecurity.be/REST/oauth/v5/token'
          scopes:
            scope:rsz-onss:management:ltds:input-rest:ltds: LTDS - Scope to be used by Employer/ServiceProvider/Representative(SocialSecretariat).
            scope:rsz-onss:management:ltds:input-rest:monitoring: LTDS - Scope to be used by monitoring.
